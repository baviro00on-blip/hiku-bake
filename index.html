<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひくバケ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Kiwi Maru', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 筆算マス目の点線・実線枠 */
        .hissan-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .hissan-box {
            width: 2.8rem;
            height: 3.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            border: 2px dashed #94a3b8;
            background-color: #ffffff;
            border-radius: 6px;
        }

        @media (min-width: 640px) {
            .hissan-box {
                width: 3.8rem;
                height: 4.4rem;
                font-size: 2.6rem;
            }
        }

        .hissan-box.ans-box {
            border: 2.5px solid #93c5fd;
            background-color: #f8fafc;
            color: #1e3a8a;
            position: relative;
        }

        .hissan-box.ans-box.next-target {
            border-color: #2563eb;
            background-color: #eff6ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: #2563eb; }
            50% { border-color: #60a5fa; }
        }

        .hissan-box.ans-box.filled {
            border-color: #3b82f6;
            background-color: #ffffff;
            color: #1d4ed8;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .key-btn {
            touch-action: manipulation;
            transition: all 0.08s ease;
        }
        .key-btn:active {
            transform: translateY(2px) scale(0.96);
        }

        .msg-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- くくバケ カードスタイル --- */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }

        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.25);
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.25);
        }

    </style>
    <!-- Firebase JS SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, getDoc, setDoc
        };
    </script>
</head>
<body class="bg-amber-50 h-screen w-screen overflow-hidden flex flex-col p-2 sm:p-4">

    <!-- ==================== メニュー画面 ==================== -->
    <div id="menu-screen" class="flex-1 max-w-5xl w-full mx-auto flex flex-col justify-between bg-white rounded-3xl shadow-xl border-4 border-amber-300 p-4 sm:p-6 overflow-y-auto">
        <!-- ヘッダー (タイトルをさらに大きく) -->
        <div class="text-center shrink-0 my-1 relative flex flex-col items-center">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-amber-900 flex items-center justify-center gap-2 sm:gap-3">
                <span>👾</span> ひくバケ
            </h1>
            <p class="text-sm sm:text-base font-extrabold text-amber-700 mt-1">ぜんぶで 84もん！ じゅんばんに くりあしていこう</p>
            
            <!-- カード図鑑への移動ボタン -->
            <button onclick="showAlbum()" class="mt-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold text-sm sm:text-base px-5 py-2 rounded-2xl shadow-lg border-2 border-indigo-200 flex items-center justify-center gap-2 btn-3d">
                <span>👾 カードずかん</span>
                <span id="menu-card-count-badge" class="bg-amber-400 text-slate-900 text-xs font-black px-2 py-0.5 rounded-full">0/84</span>
            </button>
        </div>

        <!-- メニューボタンエリア -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 my-2 shrink-0">
            <button id="btn-continue" onclick="startFromContinue()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-2xl sm:text-4xl px-12 py-5 rounded-3xl shadow-2xl border-b-8 border-emerald-700 flex items-center gap-4 transition transform hover:-translate-y-0.5">
                <span>▶️ つづきから はじめる</span>
            </button>
            <div class="text-xs sm:text-sm font-bold text-amber-800 bg-amber-100 px-4 py-2 rounded-xl border border-amber-300 shadow-sm">
                👇 やりなおす＝あかいコマをタップ
            </div>
        </div>

        <!-- プリント5枚一覧 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 sm:gap-4 my-2 items-stretch justify-center">
            <!-- JSでプリント1〜5のカードを動的生成 -->
            <div id="print-card-0" class="print-card flex flex-col h-full bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-2 sm:p-2.5 shadow-md hover:shadow-lg transition"></div>
            <div id="print-card-1" class="print-card flex flex-col h-full bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-2 sm:p-2.5 shadow-md hover:shadow-lg transition"></div>
            <div id="print-card-2" class="print-card flex flex-col h-full bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-2 sm:p-2.5 shadow-md hover:shadow-lg transition"></div>
            <div id="print-card-3" class="print-card flex flex-col h-full bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-2 sm:p-2.5 shadow-md hover:shadow-lg transition"></div>
            <div id="print-card-4" class="print-card flex flex-col h-full bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-2 sm:p-2.5 shadow-md hover:shadow-lg transition"></div>
        </div>

        <!-- 色の説明（凡例） -->
        <div class="flex items-center justify-center gap-6 text-sm sm:text-lg font-extrabold text-slate-800 my-2 shrink-0 bg-amber-100 py-3 px-6 rounded-2xl border-2 border-amber-300 self-center shadow-md">
            <span class="flex items-center gap-2"><span class="w-7 h-7 rounded-md bg-blue-500 inline-block border-2 border-blue-600 shadow"></span> つぎのもんだい</span>
            <span class="flex items-center gap-2"><span class="w-7 h-7 rounded-md bg-red-500 inline-block border-2 border-red-600 shadow"></span> くりあしたコマ</span>
            <span class="flex items-center gap-2"><span class="w-7 h-7 rounded-md bg-slate-300 inline-block border-2 border-slate-400 shadow"></span> まだのもんだい</span>
        </div>
    </div>


    <!-- ==================== 筆算 挑戦画面 ==================== -->
    <div id="game-screen" class="flex-1 max-w-5xl w-full mx-auto flex-col justify-between hidden h-full">

        <!-- ヘッダーエリア -->
        <header class="bg-white border-b-2 border-amber-300 rounded-2xl shadow-sm px-3 sm:px-4 py-2 shrink-0">
            <div class="max-w-5xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <button onclick="showMenu()" class="bg-amber-200 hover:bg-amber-300 active:scale-95 text-amber-900 font-extrabold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-amber-400 flex items-center gap-1 transition">
                        🏠 メニューへ
                    </button>
                    <button onclick="showAlbum()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-extrabold text-xs sm:text-sm px-3 py-1.5 rounded-xl border border-indigo-400 flex items-center gap-1 transition shadow-sm">
                        👾 ずかん
                    </button>
                    <div>
                        <h1 id="print-name-badge" class="text-sm sm:text-base font-extrabold text-amber-900 leading-tight">
                            プリント１ (1もんめ)
                        </h1>
                        <p id="print-subtitle" class="text-[10px] sm:text-xs font-bold text-amber-600">ひきざん (くりさがりなし)</p>
                    </div>
                </div>

                <!-- サウンド切り替え & 進捗表示 -->
                <div class="flex items-center space-x-3">
                    <div class="flex flex-col items-end">
                        <span class="text-xs font-bold text-amber-800">せいかい: <span id="total-correct-count" class="text-sm font-black text-emerald-600">0</span> / 84もん</span>
                        <div class="w-24 sm:w-32 bg-amber-100 rounded-full h-2.5 border border-amber-300 overflow-hidden mt-0.5">
                            <div id="progress-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                    <button id="sound-toggle-btn" class="p-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 transition">
                        <svg id="sound-on-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                        <svg id="sound-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 筆算カード & テンキーエリア -->
        <main class="flex-1 flex flex-col md:flex-row items-center justify-center gap-4 my-2 overflow-hidden px-2">
            <!-- 左：筆算カード -->
            <div id="hissan-card" class="relative bg-white rounded-3xl border-4 border-amber-300 p-4 sm:p-6 shadow-xl flex flex-col items-center justify-center min-w-[280px] sm:min-w-[360px]">
                
                <!-- 二重丸（◎）・フィードバックオーバーレイ -->
                <div id="feedback-overlay" class="absolute inset-0 bg-white/90 rounded-2xl z-20 flex flex-col items-center justify-center hidden pop-in">
                    <svg class="w-32 h-32 sm:w-40 sm:h-40 text-red-500 drop-shadow-md" viewBox="0 0 100 100" fill="none" stroke="currentColor">
                        <circle cx="50" cy="50" r="38" stroke-width="7"/>
                        <circle cx="50" cy="50" r="22" stroke-width="7"/>
                    </svg>
                    <span class="text-2xl font-black text-red-600 mt-2">たいへん よくできました！◎</span>
                </div>

                <!-- 誤答メッセージ -->
                <div id="wrong-msg" class="absolute -top-3 bg-rose-500 text-white font-extrabold text-xs sm:text-sm px-4 py-1.5 rounded-full shadow-lg opacity-0 transition-opacity z-10 whitespace-nowrap">
                    かしこくなるチャンス！もう１かいやってみよう
                </div>

                <!-- 筆算グリッド -->
                <div class="relative flex flex-col items-end my-2">
                    <div class="absolute -left-10 top-1 text-sm font-extrabold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-lg border border-amber-300">
                        <span id="global-q-num">1</span>
                    </div>
                    <div id="row-num1" class="hissan-grid mb-1"></div>
                    <div class="relative">
                        <span class="absolute -left-7 top-1 text-3xl font-black text-slate-800">-</span>
                        <div id="row-num2" class="hissan-grid mb-1"></div>
                    </div>
                    <div class="w-full h-1 bg-slate-800 rounded-full my-1"></div>
                    <div id="row-answer" class="hissan-grid mt-1"></div>
                </div>
            </div>

            <!-- 右：テンキーボード -->
            <div class="bg-amber-100 rounded-3xl border-3 border-amber-300 p-3 sm:p-4 shadow-md flex flex-col gap-2 w-full max-w-[280px] sm:max-w-[320px]">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="pressKey('7')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">7</button>
                    <button onclick="pressKey('8')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">8</button>
                    <button onclick="pressKey('9')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">9</button>

                    <button onclick="pressKey('4')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">4</button>
                    <button onclick="pressKey('5')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">5</button>
                    <button onclick="pressKey('6')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">6</button>

                    <button onclick="pressKey('1')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">1</button>
                    <button onclick="pressKey('2')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">2</button>
                    <button onclick="pressKey('3')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">3</button>

                    <button onclick="pressKey('0')" class="key-btn bg-white hover:bg-amber-50 text-slate-800 font-extrabold text-2xl py-3 rounded-2xl border-b-4 border-slate-300 shadow">0</button>
                    <button onclick="pressKey('backspace')" class="key-btn bg-amber-200 hover:bg-amber-300 text-amber-900 font-extrabold text-sm py-3 rounded-2xl border-b-4 border-amber-400 shadow flex items-center justify-center gap-1">
                        <span>⌫ 1つけす</span>
                    </button>
                    <button onclick="pressKey('clear')" class="key-btn bg-rose-200 hover:bg-rose-300 text-rose-900 font-extrabold text-sm py-3 rounded-2xl border-b-4 border-rose-400 shadow">
                        けす
                    </button>
                </div>

                <button onclick="checkAnswer()" class="key-btn bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-xl py-3.5 rounded-2xl border-b-4 border-emerald-700 shadow-lg mt-1 transition flex items-center justify-center gap-2">
                    <span>かいとう</span>
                    <span>✓</span>
                </button>
            </div>
        </main>
    </div>

    <!-- ==================== カードゲット モーダル ==================== -->
    <div id="card-get-modal" onclick="closeCardGetModal()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4 hidden cursor-pointer">
        <div class="bg-slate-900 border-4 border-amber-400 rounded-3xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl pop-in relative" onclick="event.stopPropagation()">
            <div class="space-y-1">
                <span class="inline-block bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-900 font-black text-xs px-3 py-1 rounded-full shadow">
                    ✨ せいかい おめでとう！ ✨
                </span>
                <h3 class="text-2xl font-black text-amber-300">バケモノカード ゲット！</h3>
            </div>
            
            <div id="get-card-preview-container" class="flex justify-center py-2">
                <!-- 獲得したカードが入る -->
            </div>

            <button onclick="closeCardGetModal()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl shadow-lg border-b-4 border-emerald-700 btn-3d">
                つぎの もんだいへ ▶️
            </button>
        </div>
    </div>

    <!-- ==================== カードずかん 画面 ==================== -->
    <div id="album-screen" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col p-3 sm:p-5 text-white hidden overflow-hidden">
        <div class="max-w-5xl w-full mx-auto flex-1 flex flex-col space-y-3 min-h-0">
            <!-- ヘッダー -->
            <div class="flex justify-between items-center border-b border-indigo-500/40 pb-3 shrink-0">
                <div>
                    <h2 class="text-xl sm:text-2xl font-black text-amber-300 flex items-center gap-2">
                        <span>👾</span> バケモノカードずかん
                    </h2>
                    <p class="text-indigo-200 text-xs sm:text-sm font-bold">ゲットしたカードをタップすると おおきく みられるよ！</p>
                </div>
                <button onclick="closeAlbum()" class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-black px-4 py-2 rounded-2xl text-sm border-2 border-white shadow-lg btn-3d flex items-center gap-1">
                    <span>🔙 もどる</span>
                </button>
            </div>

            <!-- レア度別フィルター -->
            <div id="album-filter-bar" class="flex gap-2 overflow-x-auto pb-1 shrink-0">
                <!-- JSで動的生成 -->
            </div>

            <!-- カード一覧グリッド -->
            <div id="album-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1 min-h-0">
                <!-- 動的生成 -->
            </div>
        </div>
    </div>

    <!-- カード詳細拡大モーダル -->
    <div id="card-detail-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 hidden" onclick="closeCardDetailModal()">
        <div class="relative transform scale-110 sm:scale-125 transition-transform duration-300" onclick="event.stopPropagation()">
            <div id="detail-card-container"></div>
        </div>
        <button onclick="closeCardDetailModal()" class="mt-8 bg-white/20 hover:bg-white/30 text-white font-black px-6 py-2 rounded-full border border-white/40 text-sm shadow-xl backdrop-blur-md">
            とじる
        </button>
    </div>

    <!-- 全プリントコンプリート モーダル -->
    <div id="all-clear-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl border-4 border-amber-400 pop-in">
            <div class="text-7xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-3xl font-black text-amber-900 mb-2">ぜんぶ くりあ！</h2>
            <p class="text-slate-600 font-bold mb-6">84もんの ひきざんを ぜんぶ くりあしたよ！すばらしい！</p>
            <button onclick="restartAll()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xl py-4 rounded-2xl shadow-lg border-b-4 border-amber-700 transition">
                もういちど さいしょから ちょうせんする 🔄
            </button>
        </div>
    </div>

    <!-- Canvas (紙吹雪用) -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <script>
        // ==========================================
        // 84問統合データモデル (すべてひらがな表記)
        // ==========================================
        const PRINT_CONFIG = [
            { id: 1, name: "プリント１", subtitle: "(くりさがりなし)", count: 20, rows: 5 },
            { id: 2, name: "プリント２", subtitle: "(くりさがり2かい)", count: 20, rows: 5 },

        // Firebase & Cloud Save
        let db = null;
        let auth = null;
        let userId = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'hissan-subtraction-app';

        async function initFirebase() {
            if (!window.firebaseModules) return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseModules;
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (!firebaseConfig) return;

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (initialToken) {
                try {
                    await signInWithCustomToken(auth, initialToken);
                } catch (e) {
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }

            userId = auth.currentUser?.uid || 'guest-user';
            await loadSaveData();
        }

        // セーブデータ取得
        async function loadSaveData() {
            if (!db || !userId) return;
            try {
                const { doc, getDoc } = window.firebaseModules;
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'progress', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (Array.isArray(data.clearedFlags)) {
                        clearedFlags = data.clearedFlags;
                    }
                    if (Array.isArray(data.ownedCards)) {
                        ownedCards = data.ownedCards;
                    }
                    if (typeof data.currentGlobalQIdx === 'number') {
                        currentGlobalQIdx = data.currentGlobalQIdx;
                    }
                }
            } catch (err) {
                console.error("Save load error:", err);
            }
            updateCardBadge();
            renderMenuCards();
        }

        // 自動セーブ保存
        async function saveProgress() {
            updateCardBadge();
            renderMenuCards();
            if (!db || !userId) return;
            try {
                const { doc, setDoc } = window.firebaseModules;
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'progress', 'data');
                await setDoc(docRef, {
                    clearedFlags: clearedFlags,
                    ownedCards: ownedCards,
                    currentGlobalQIdx: currentGlobalQIdx,
                    updatedAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Save write error:", err);
            }
        }

        // 音声合成
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            if (!isSoundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'correct') {
                const playSoftNote = (freq, time, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(0.2, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + duration);
                };
                playSoftNote(261.63, now, 0.25);
                playSoftNote(329.63, now + 0.12, 0.45);
            } else if (type === 'card') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'fanfare') {
                const notes = [
                    { f: 261.63, t: 0 }, { f: 329.63, t: 0.12 }, { f: 392.00, t: 0.24 }, { f: 523.25, t: 0.36 },
                    { f: 392.00, t: 0.52 }, { f: 523.25, t: 0.68 }, { f: 659.25, t: 0.88 }, { f: 783.99, t: 1.08 },
                    { f: 1046.50, t: 1.35 }
                ];
                notes.forEach((note) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, now + note.t);
                    gain.gain.setValueAtTime(0.25, now + note.t);
                    const dur = note.f > 800 ? 1.2 : 0.3;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + note.t);
                    osc.stop(now + note.t + dur);
                });
            }
        }

            }

            window.addEventListener('keydown', (e) => {
                if (!document.getElementById('card-get-modal').classList.contains('hidden')) {
                    if (e.key === 'Enter' || e.key === 'NumpadEnter' || e.key === ' ') {
                        e.preventDefault();
                        closeCardGetModal();
                    }
                    return;
                }
                if (document.getElementById('game-screen').classList.contains('hidden')) return;
                if (!document.getElementById('album-screen').classList.contains('hidden')) return;
                if (isProcessingAnswer) return;

                if (e.key >= '0' && e.key <= '9') {
                    pressKey(e.key);
                } else if (e.key === 'Backspace') {
                    pressKey('backspace');
                } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                    pressKey('clear');
                } else if (e.key === 'Enter' || e.key === 'NumpadEnter') {
                    e.preventDefault();
                    checkAnswer();
                }
            });
        }

        // メニュー画面のプリントカード生成
        function renderMenuCards() {
            let qOffset = 0;
            let nextUncleared = clearedFlags.findIndex(flag => !flag);
            if (nextUncleared === -1) nextUncleared = TOTAL_QUESTIONS - 1;

            const targetActiveIdx = (currentGlobalQIdx !== undefined && currentGlobalQIdx < TOTAL_QUESTIONS) 
                ? currentGlobalQIdx 
                : (nextUncleared !== -1 ? nextUncleared : 0);

            PRINT_CONFIG.forEach((pConfig, pIdx) => {
                const cardEl = document.getElementById(`print-card-${pIdx}`);
                cardEl.innerHTML = '';

                const titleEl = document.createElement('div');
                titleEl.className = 'font-extrabold text-xs sm:text-sm text-amber-900 text-center mb-1.5 border-b-2 border-amber-200 pb-0.5 shrink-0';
                titleEl.textContent = pConfig.name;
                cardEl.appendChild(titleEl);

                const gridEl = document.createElement('div');
                const rowClass = pConfig.rows === 3 ? 'grid-rows-3' : 'grid-rows-5';
                gridEl.className = `grid grid-cols-4 ${rowClass} gap-1 sm:gap-1.5 w-full flex-1 h-full min-h-[150px] sm:min-h-[190px]`;

                for (let i = 0; i < pConfig.count; i++) {
                    const globalIdx = qOffset + i;
                    const isCleared = clearedFlags[globalIdx];
                    const isNextTarget = (globalIdx === targetActiveIdx);

                    const box = document.createElement('button');
                    
                    let colorClass = 'bg-slate-300 border-slate-400 cursor-not-allowed opacity-90';
                    let isClickable = false;

                    if (isCleared) {
                        colorClass = 'bg-red-500 border-red-600 shadow-sm hover:opacity-90 cursor-pointer';
                        isClickable = true;
                    } else if (isNextTarget) {
                        colorClass = 'bg-blue-500 border-blue-600 ring-2 ring-blue-300 shadow-md animate-pulse cursor-pointer';
                        isClickable = true;
                    }

                    box.className = `w-full h-full rounded border transition transform ${isClickable ? 'active:scale-95' : ''} ${colorClass}`;
                    box.title = `${pConfig.name} - ${i + 1}もんめ (${isCleared ? 'くりあした' : isNextTarget ? 'つぎちょうせん' : 'まだあいていないよ'})`;
                    
                    if (isClickable) {
                        box.onclick = () => startFromQuestion(globalIdx);
                    } else {
                        box.disabled = true;
                    }
                    
                    gridEl.appendChild(box);
                }
                cardEl.appendChild(gridEl);
                qOffset += pConfig.count;
            });
        }

        function startFromContinue() {
            let nextUncleared = clearedFlags.findIndex(flag => !flag);
            if (nextUncleared === -1) nextUncleared = 0;
            startFromQuestion(nextUncleared);
        }

        function startFromQuestion(globalIdx) {
            currentGlobalQIdx = globalIdx;
            enteredDigits = [];
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            renderQuestion();
        }

        function showMenu() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('menu-screen').classList.remove('hidden');
            renderMenuCards();
        }

        function renderQuestion() {
            const qData = ALL_QUESTIONS[currentGlobalQIdx];
            const pConfig = PRINT_CONFIG[qData.pIdx];
            const maxDigits = 4;

            document.getElementById('print-name-badge').textContent = `${pConfig.name} (${qData.pQNum}もんめ)`;
            document.getElementById('print-subtitle').textContent = pConfig.subtitle;
            document.getElementById('global-q-num').textContent = currentGlobalQIdx + 1;

            const totalClearedCount = clearedFlags.filter(Boolean).length;
            document.getElementById('total-correct-count').textContent = totalClearedCount;

            const progressPercent = (totalClearedCount / TOTAL_QUESTIONS) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const strNum1 = qData.n1.toString().padStart(maxDigits, ' ');
            const strNum2 = qData.n2.toString().padStart(maxDigits, ' ');

            const row1El = document.getElementById('row-num1');
            row1El.innerHTML = '';
            for (let char of strNum1) {
                const box = document.createElement('div');
                box.className = 'hissan-box';
                box.textContent = char !== ' ' ? char : '';
                row1El.appendChild(box);
            }

            const row2El = document.getElementById('row-num2');
            row2El.innerHTML = '';
            for (let char of strNum2) {
                const box = document.createElement('div');
                box.className = 'hissan-box';
                box.textContent = char !== ' ' ? char : '';
                row2El.appendChild(box);
            }

            renderAnswerRow();
        }

        function renderAnswerRow() {
            const rowAnsEl = document.getElementById('row-answer');
            rowAnsEl.innerHTML = '';
            const maxDigits = 4;

            for (let placeIndex = maxDigits - 1; placeIndex >= 0; placeIndex--) {
                const box = document.createElement('div');
                box.className = 'hissan-box ans-box';
                
                const val = enteredDigits[placeIndex];
                if (val !== undefined) {
                    box.textContent = val;
                    box.classList.add('filled');
                } else {
                    box.textContent = '';
                }

                if (placeIndex === enteredDigits.length && enteredDigits.length < maxDigits) {
                    box.classList.add('next-target');
                }

                rowAnsEl.appendChild(box);
            }
        }

        function pressKey(key) {
            if (isProcessingAnswer) return;
            playSound('click');

            if (key === 'clear') {
                enteredDigits = [];
            } else if (key === 'backspace') {
                enteredDigits.pop();
            } else if (typeof key === 'string' && key >= '0' && key <= '9') {
                if (enteredDigits.length < 4) {
                    enteredDigits.push(parseInt(key, 10));
                }
            }
            renderAnswerRow();
        }

        function getEnteredValue() {
            if (enteredDigits.length === 0) return null;
            let val = 0;
            for (let i = 0; i < enteredDigits.length; i++) {
                val += enteredDigits[i] * Math.pow(10, i);
            }
            return val;
        }

        // 各レア度の基本重み
        const RARITY_WEIGHT_MAP = {
            'C': 100,
            'U': 70,
            'R': 45,
            'RR': 30,
            'AR': 20,
            'SR': 12,
            'SAR': 6,
            'UR': 3,
            'MUR': 1
        };

        function pickWeightedCard(cardList) {
            if (!cardList || cardList.length === 0) return BAKE_CARDS[0];
            let totalWeight = 0;
            const weights = cardList.map(c => {
                const w = RARITY_WEIGHT_MAP[c.rarity] || 10;
                totalWeight += w;
                return w;
            });
            let rand = Math.random() * totalWeight;
            for (let i = 0; i < cardList.length; i++) {
                if (rand < weights[i]) return cardList[i];
                rand -= weights[i];
            }
            return cardList[0];
        }

        // カード獲得ロジック
        function getRewardCardForQuestion(qIdx, isFirstClear) {
            const qData = ALL_QUESTIONS[qIdx];
            const pIdx = qData.pIdx;

            // プリントごとの解禁レア度
            let allowedRarities = [];
            if (pIdx === 0) {
                allowedRarities = ['C', 'U', 'R'];
            } else if (pIdx === 1) {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR'];
            } else if (pIdx === 2) {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR'];
            } else if (pIdx === 3) {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR', 'UR'];
            } else {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR', 'UR', 'MUR'];
            }

            const pool = BAKE_CARDS.filter(c => allowedRarities.includes(c.rarity));

            if (isFirstClear) {
                const unownedInPool = pool.filter(c => !ownedCards.includes(c.id));
                if (unownedInPool.length > 0) {
                    return pickWeightedCard(unownedInPool);
                } else {
                    const unownedOverall = BAKE_CARDS.filter(c => !ownedCards.includes(c.id));
                    if (unownedOverall.length > 0) {
                        return pickWeightedCard(unownedOverall);
                    }
                    return pickWeightedCard(pool);
                }
            } else {
                const ownedInPool = pool.filter(c => ownedCards.includes(c.id));
                if (ownedInPool.length > 0) {
                    return pickWeightedCard(ownedInPool);
                } else if (ownedCards.length > 0) {
                    const ownedOverall = BAKE_CARDS.filter(c => ownedCards.includes(c.id));
                    return pickWeightedCard(ownedOverall);
                }
                return pickWeightedCard(pool);
            }
        }

        // 回答判定
        function checkAnswer() {
            if (isProcessingAnswer) return;
            const qData = ALL_QUESTIONS[currentGlobalQIdx];
            const expectedAns = qData.n1 - qData.n2;
            const userAns = getEnteredValue();

            const wrongMsg = document.getElementById('wrong-msg');
            const feedbackOverlay = document.getElementById('feedback-overlay');
            const cardModal = document.getElementById('card-get-modal');

            if (userAns === expectedAns) {
                isProcessingAnswer = true;
                playSound('correct');

                feedbackOverlay.classList.remove('hidden');

                const isFirstClear = !clearedFlags[currentGlobalQIdx];
                clearedFlags[currentGlobalQIdx] = true;

                const rewardCard = getRewardCardForQuestion(currentGlobalQIdx, isFirstClear);
                if (!ownedCards.includes(rewardCard.id)) {
                    ownedCards.push(rewardCard.id);
                }

                saveProgress();

                setTimeout(() => {
                    feedbackOverlay.classList.add('hidden');

                    const previewContainer = document.getElementById('get-card-preview-container');
                    if (previewContainer) {
                        previewContainer.innerHTML = createCardHtml(rewardCard, false);
                    }
                    playSound('card');
                    cardModal.classList.remove('hidden');

                    const allCleared = clearedFlags.every(Boolean);
                    if (allCleared) {
                        launchConfetti();
                        playSound('fanfare');
                    }
                }, 1200);

            } else {
                playSound('wrong');
                wrongMsg.classList.remove('opacity-0');
                enteredDigits = [];
                renderAnswerRow();
                
                const cardBox = document.getElementById('hissan-card');
                if (cardBox) {
                    cardBox.classList.add('shake');
                    setTimeout(() => cardBox.classList.remove('shake'), 450);
                }

                setTimeout(() => {
                    wrongMsg.classList.add('opacity-0');
                }, 2500);
            }
        }

        function closeCardGetModal() {
            document.getElementById('card-get-modal').classList.add('hidden');
            isProcessingAnswer = false;
            enteredDigits = [];

            const allCleared = clearedFlags.every(Boolean);
            if (allCleared) {
                document.getElementById('all-clear-modal').classList.remove('hidden');
                return;
            }

            if (currentGlobalQIdx < TOTAL_QUESTIONS - 1) {
                currentGlobalQIdx++;
                renderQuestion();
            } else {
                let nextUncleared = clearedFlags.findIndex(flag => !flag);
                if (nextUncleared !== -1) {
                    currentGlobalQIdx = nextUncleared;
                    renderQuestion();
                } else {
                    showMenu();
                }
            }
        }

        // カードDOM作成
        function createCardHtml(card, isModal = false) {
            const scaleClass = isModal ? 'w-56 h-80 sm:w-64 sm:h-96' : 'w-48 h-72';
            const rarityBadgeMap = {
                'C': '● C', 'U': '◆ U', 'R': '★ R', 'RR': '★★ RR',
                'AR': '🎨 AR', 'SR': '輝 SR', 'SAR': '✨ SAR', 'UR': '🏆 UR', 'MUR': '👑 MUR'
            };
            const rarityBadge = rarityBadgeMap[card.rarity] || card.rarity;

            const isFoilRarity = ['AR', 'SR', 'SAR', 'UR', 'MUR'].includes(card.rarity);
            let extraEffectClass = isFoilRarity ? 'card-foil' : '';
            let borderStyle = 'border-amber-500/80';

            if (card.rarity === 'MUR') {
                extraEffectClass = 'card-foil animate-rainbow-glow';
                borderStyle = 'border-yellow-200';
            } else if (card.rarity === 'UR') {
                extraEffectClass = 'card-foil';
                borderStyle = 'border-yellow-400 gold-glow';
            } else if (card.rarity === 'SAR' || card.rarity === 'SR') {
                extraEffectClass = 'card-foil';
                borderStyle = 'border-pink-300 super-glow';
            }

            const nameClass = isModal 
                ? 'text-xs sm:text-sm tracking-wide text-amber-200 drop-shadow-md leading-tight break-words font-black max-w-[140px]' 
                : 'text-sm sm:text-base tracking-wide truncate max-w-[110px] drop-shadow-md text-amber-200';

            const illusBgClass = 'bg-stone-950/70 border-white/20 shadow-inner';

            return `
                <div class="relative ${scaleClass} rounded-2xl p-2.5 bg-gradient-to-b ${card.bgTone} border-4 ${borderStyle} shadow-2xl flex flex-col justify-between ${extraEffectClass} text-white overflow-hidden select-none">
                    
                    <div class="flex justify-between items-center z-10 font-black border-b border-white/20 pb-1">
                        <span class="${nameClass}">${card.name}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full ${card.typeBg} font-bold shadow-sm shrink-0">HP ${card.hp}</span>
                    </div>

                    <div class="my-1.5 flex-1 rounded-xl ${illusBgClass} border flex items-center justify-center relative overflow-hidden shadow-inner min-h-[110px]">
                        ${getBakeSvgIllustration(card)}

                            <span class="text-amber-300 flex items-center gap-1">

                                <span>${card.attack}</span>
                            </span>
                            <span class="text-sm font-black text-rose-400">${card.damage}</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center z-10 text-[10px] text-amber-200/80 pt-1 font-bold">
                        <span>${rarityBadge}</span>

                    </div>
                </div>

        }

        // カードずかん画面制御
        function showAlbum() {
            document.getElementById('album-screen').classList.remove('hidden');
            renderAlbumFilters();
            renderAlbumGrid();
        }

        function closeAlbum() {
            document.getElementById('album-screen').classList.add('hidden');
        }

        function renderAlbumFilters() {
            const filterBar = document.getElementById('album-filter-bar');
            if (!filterBar) return;

            const filters = ['ALL', ...RARITY_ORDER];
            filterBar.innerHTML = '';

            filters.forEach(rarity => {
                const btn = document.createElement('button');
                let count = 0;
                let totalInRarity = 0;

                if (rarity === 'ALL') {
                    count = ownedCards.length;
                    totalInRarity = BAKE_CARDS.length;
                } else {
                    count = BAKE_CARDS.filter(c => c.rarity === rarity && ownedCards.includes(c.id)).length;
                    totalInRarity = BAKE_CARDS.filter(c => c.rarity === rarity).length;
                }

                const isActive = currentAlbumFilter === rarity;

                btn.className = `px-3 py-1 rounded-full text-xs font-black whitespace-nowrap transition-all ${
                    isActive 
                        ? 'bg-amber-400 text-slate-900 border-2 border-white shadow' 
                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-indigo-500/30'
                }`;
                btn.innerText = `${rarity} (${count}/${totalInRarity})`;
                btn.onclick = () => {
                    currentAlbumFilter = rarity;
                    renderAlbumFilters();
                    renderAlbumGrid();
                };
                filterBar.appendChild(btn);
            });
        }

        function renderAlbumGrid() {
            const grid = document.getElementById('album-grid');
            if (!grid) return;
            grid.innerHTML = '';

            let filteredCards = BAKE_CARDS;
            if (currentAlbumFilter !== 'ALL') {
                filteredCards = BAKE_CARDS.filter(c => c.rarity === currentAlbumFilter);
            }

            filteredCards.forEach(card => {
                const isOwned = ownedCards.includes(card.id);
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform duration-200";

                if (isOwned) {
                    wrapper.innerHTML = createCardHtml(card);
                    wrapper.onclick = () => showCardDetailModal(card);
                } else {
                    wrapper.innerHTML = `
                        <div class="w-full h-44 sm:h-52 rounded-2xl bg-slate-900/80 border-2 border-slate-700 flex flex-col items-center justify-center text-slate-600 p-2 text-center shadow-inner relative overflow-hidden">
                            <i data-lucide="lock" class="w-8 h-8 mb-2 text-slate-600"></i>
                            <span class="text-xs font-bold text-slate-500">???</span>
                            <span class="text-[10px] text-slate-600 mt-1 uppercase font-bold">${card.rarity}</span>
                        </div>
                    `;
                }
                grid.appendChild(wrapper);
            });

            if (window.lucide) lucide.createIcons();
        }

        function showCardDetailModal(card) {
            const container = document.getElementById('detail-card-container');
            if (!container) return;
            container.innerHTML = createCardHtml(card, true);
            document.getElementById('card-detail-modal').classList.remove('hidden');
        }

        function closeCardDetailModal() {
            document.getElementById('card-detail-modal').classList.add('hidden');
        }

        // 紙吹雪・花火・スポットライト豪華エフェクト
        let confettiAnimId = null;
        function resizeCanvas() {
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            resizeCanvas();

            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f97316'];
            
            // 1. 紙吹雪
            const particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 2 - 1,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    vRot: Math.random() * 10 - 5
                });
            }

            // 2. 花火
            const fireworks = [];
            function createFirework() {
                const fx = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
                const fy = Math.random() * (canvas.height * 0.4) + canvas.height * 0.1;
                const count = Math.floor(Math.random() * 35) + 40;
                const fwColor = colors[Math.floor(Math.random() * colors.length)];
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                    const speed = Math.random() * 6 + 3;
                    fireworks.push({
                        x: fx, y: fy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 4 + 2,
                        color: fwColor,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
            }

            let frame = 0;
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frame++;

                // スポットライト描画
                ctx.save();
                const angle = (frame * 0.02);
                const spotlightColors = ['rgba(255, 230, 0, 0.15)', 'rgba(236, 72, 153, 0.15)', 'rgba(59, 130, 246, 0.15)'];
                for (let i = 0; i < 3; i++) {
                    const a = angle + (i * (Math.PI * 2 / 3));
                    const x1 = canvas.width / 2;
                    const y1 = 0;
                    const x2 = x1 + Math.cos(a) * canvas.height * 1.2;
                    const y2 = Math.sin(a) * canvas.height * 1.2;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2 - 120, y2);
                    ctx.lineTo(x2 + 120, y2);
                    ctx.closePath();
                    ctx.fillStyle = spotlightColors[i];
                    ctx.fill();
                }
                ctx.restore();

                // 偶数フレームごとに花火発生
                if (frame % 25 === 0) createFirework();

                // 花火更新＆描画
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    fw.x += fw.vx;
                    fw.y += fw.vy;
                    fw.vy += 0.05;
                    fw.alpha -= fw.decay;
                    if (fw.alpha <= 0) {
                        fireworks.splice(i, 1);
                        continue;
                    }
                    ctx.save();
                    ctx.globalAlpha = fw.alpha;
                    ctx.fillStyle = fw.color;
                    ctx.beginPath();
                    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // 紙吹雪更新＆描画
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vRot;
                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                confettiAnimId = requestAnimationFrame(loop);
            }
            loop();

            setTimeout(() => {
                if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 9000);
        }

        function restartAll() {
            document.getElementById('all-clear-modal').classList.add('hidden');
            clearedFlags = new Array(TOTAL_QUESTIONS).fill(false);
            currentGlobalQIdx = 0;
            saveProgress();
            showMenu();
        }
    </script>
